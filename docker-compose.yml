services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ALLOW_LOCAL_ORIGINS: ${ALLOW_LOCAL_ORIGINS:-1}
      DATABASE_PATH: /data/margin-pulse.sqlite
    volumes:
      - margin-pulse-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  margin-pulse-data:
