services:
  - type: web
    name: margin-pulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:8080
      - key: DATABASE_PATH
        value: /data/margin-pulse.sqlite
    disk:
      name: margin-pulse-data
      mountPath: /data
      sizeGB: 1
